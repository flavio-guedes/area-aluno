<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPQ — Área do Aluno</title>
<style>
  :root {
    --bg: #020b16;
    --surface: #0a1628;
    --surface-2: #0f2140;
    --border: #1a3a5c;
    --text: #e6f3ff;
    --text-muted: #7d9cbd;
    --cyan: #22d3ee;
    --cyan-dim: rgba(34,211,238,0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .hero {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 10px;
    background:
      linear-gradient(135deg, rgba(34,211,238,0.08), transparent 40%),
      var(--surface);
  }
  .hero-inner {
    position: relative;
    z-index: 1;
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 24px;
    align-items: center;
  }
  .hero-brand {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    letter-spacing: 0.35em;
    color: var(--cyan);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .hero-brand::before {
    content: "";
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
  }
  .hero-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.15em;
    color: var(--text);
    margin-top: 8px;
  }
  .hero-title span {
    color: var(--cyan);
  }
  .hero-sub {
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .hero-values {
    margin-top: 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .value-chip {
    background: var(--cyan-dim);
    border: 1px solid rgba(34,211,238,0.35);
    color: var(--cyan);
    padding: 6px 10px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .hero-visual {
    position: relative;
    min-height: 220px;
    background:
      linear-gradient(180deg, rgba(15,33,64,0.0), rgba(15,33,64,0.55));
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    overflow: hidden;
  }
  .hero-visual::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 70% 40%, rgba(34,211,238,0.18), transparent 55%),
      linear-gradient(135deg, transparent, rgba(34,211,238,0.08));
    pointer-events: none;
  }
  .hero-logo {
    position: relative;
    z-index: 1;
    max-height: 140px;
    max-width: 100%;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(34,211,238,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }
  @media (max-width: 980px) {
    .hero-inner { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="hero">
  <div class="hero-inner">
    <div>
      <div class="hero-brand">EPQ</div>
      <div class="hero-title">ÁREA DO <span>ALUNO</span></div>
      <div class="hero-sub">ESTUDANDO POR QUESTÕES</div>
      <div class="hero-values">
        <div class="value-chip">Foco</div>
        <div class="value-chip">Disciplina</div>
        <div class="value-chip">Constância</div>
        <div class="value-chip">Resultados</div>
      </div>
    </div>
    <div class="hero-visual">
      <img class="hero-logo" src="logo.jpg" alt="Logo EPQ" />
    </div>
  </div>
</div>
</body>
</html>
