<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Aluno — EPQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020b16;
    --surface: #0a1628;
    --surface-2: #0f2140;
    --border: #1a3a5c;
    --text: #e6f3ff;
    --text-muted: #7d9cbd;
    --cyan: #4169E1;
    --cyan-dim: rgba(65,105,225,0.25);
    --green: #34d399;
    --green-dim: rgba(52,211,153,0.15);
    --orange: #fbbf24;
    --orange-dim: rgba(251,191,36,0.15);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.18);
    --purple: #a78bfa;
    --purple-dim: rgba(167,139,250,0.15);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  :focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(34,211,238,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,211,238,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }
  .container {
    position: relative;
    z-index: 1;
    height: 100vh;
    max-width: 1800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 12px;
  }
  .sidebar {
    width: 240px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .sidebar.collapsed {
    width: 64px;
  }
  .sidebar-brand {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-brand::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .sidebar-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    transition: all 0.15s;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-item:hover, .sidebar-item.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
  }
  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 10px;
    flex-wrap: wrap;
  }
  .search-input, .filter-select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .search-input { flex: 1; min-width: 200px; }
  .search-input:focus, .filter-select:focus { border-color: var(--cyan); }
  .content-area {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding-right: 4px;
  }
  .content-area::-webkit-scrollbar { width: 6px; }
  .content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn.primary {
    background: var(--cyan-dim);
    border-color: var(--cyan);
    color: var(--cyan);
  }
  @media (max-width: 980px) {
    .sidebar { width: 64px; }
  }
  @media (max-width: 640px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="container">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">EPQ</div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="sidebar-item active" data-page="home" href="#">Início</a>
        <a class="sidebar-item" data-page="estudar" href="#">Estudar</a>
        <a class="sidebar-item" data-page="questoes" href="#">Questões</a>
        <a class="sidebar-item" data-page="simulados" href="#">Simulados</a>
        <a class="sidebar-item" data-page="desempenho" href="#">Desempenho</a>
        <a class="sidebar-item" data-page="cronograma" href="#">Cronograma</a>
        <a class="sidebar-item" data-page="materiais" href="#">Materiais</a>
      </nav>
      <div class="sidebar-footer">
        <a class="sidebar-item" href="#">Meu perfil</a>
        <a class="sidebar-item" href="#">Configurações</a>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <input class="search-input" id="search" placeholder="Pesquisar questões, simulados ou materiais..." />
        <select class="filter-select" id="page-filter">
          <option value="home">Início</option>
          <option value="estudar">Estudar</option>
          <option value="questoes">Questões</option>
          <option value="simulados">Simulados</option>
          <option value="desempenho">Desempenho</option>
          <option value="cronograma">Cronograma</option>
          <option value="materiais">Materiais</option>
        </select>
      </div>
      <div class="content-area" id="content"></div>
    </main>
  </div>
</div>

<script>
const PAGES = {
  home: () => `
    <div class="section-title">Olá, João</div>
    <div style="color:var(--text-muted);font-size:12px;margin-bottom:12px;">Continue firme. Cada questão aproxima você da aprovação.</div>
    <div class="section-title">Continue de onde parou</div>
    <div class="item">
      <div class="item-header"><span class="item-name">Direito Administrativo</span></div>
      <div class="detail-section"><div class="detail-label">Aula atual</div><div class="detail-text">Aula 12 — Licitações</div></div>
      <div class="detail-section"><div class="detail-label">Progresso</div><div class="detail-text">72%</div></div>
      <div class="actions"><button class="btn primary" onclick="alert('Continuar estudo')">Continuar estudando</button></div>
    </div>
    <div class="section-title" style="margin-top:12px;">Seu progresso</div>
    <div class="chips">
      <span class="chip">Questões resolvidas: 1.248</span>
      <span class="chip ok">Acertos: 78%</span>
      <span class="chip">Sequência: 12 dias</span>
      <span class="chip">Horas: 34h</span>
    </div>
    <div class="section-title" style="margin-top:12px;">Para hoje</div>
    <div class="item"><div class="item-header"><span class="item-name">Direito Administrativo</span></div><div class="detail-text">50 questões</div></div>
    <div class="item"><div class="item-header"><span class="item-name">Português</span></div><div class="detail-text">30 questões</div></div>
    <div class="item"><div class="item-header"><span class="item-name">Revisão</span></div><div class="detail-text">15 questões</div></div>
  `,
  questoes: () => `
    <div class="section-title">Questões</div>
    <div class="chips">
      <span class="chip">Disciplina</span>
      <span class="chip">Assunto</span>
      <span class="chip">Banca</span>
      <span class="chip">Cargo</span>
      <span class="chip">Dificuldade</span>
      <span class="chip">Ano</span>
    </div>
    <div class="item">
      <div class="item-header"><span class="item-name">Questão 01</span></div>
      <div class="detail-section"><div class="detail-label">Enunciado</div><div class="detail-text">Marque a alternativa correta sobre licitações.</div></div>
      <div class="actions"><button class="btn primary" onclick="alert('Responder questão')">Responder</button></div>
    </div>
  `,
  simulados: () => `
    <div class="section-title">Simulados</div>
    <div class="item">
      <div class="item-header"><span class="item-name">Simulado Polícia Penal — 01</span></div>
      <div class="detail-text">50 questões • 60 minutos</div>
      <div class="actions"><button class="btn primary" onclick="alert('Iniciar simulado')">Iniciar simulado</button></div>
    </div>
  `,
  desempenho: () => `
    <div class="section-title">Desempenho</div>
    <div class="chips">
      <span class="chip ok">Acertos: 78%</span>
      <span class="chip warn">Português: 54%</span>
      <span class="chip">Direito Constitucional: 61%</span>
    </div>
    <div class="section-title" style="margin-top:12px;">Precisa de atenção</div>
    <div class="item"><div class="item-header"><span class="item-name">Português</span></div><div class="detail-text">Concordância verbal — 54%</div><div class="actions"><button class="btn primary" onclick="alert('Praticar')">Praticar</button></div></div>
    <div class="item"><div class="item-header"><span class="item-name">Direito Constitucional</span></div><div class="detail-text">Controle de constitucionalidade — 61%</div><div class="actions"><button class="btn primary" onclick="alert('Praticar')">Praticar</button></div></div>
  `,
  cronograma: () => `
    <div class="section-title">Cronograma</div>
    <div class="item"><div class="item-header"><span class="item-name">Hoje</span></div><div class="detail-text">Direito Administrativo — 50 questões</div></div>
    <div class="item"><div class="item-header"><span class="item-name">Amanhã</span></div><div class="detail-text">Português — 30 questões</div></div>
  `,
  materiais: () => `
    <div class="section-title">Materiais</div>
    <div class="item"><div class="item-header"><span class="item-name">PDF</span></div><div class="detail-text">Direito Administrativo — Aula 12</div></div>
    <div class="item"><div class="item-header"><span class="item-name">Videoaula</span></div><div class="detail-text">Licitações — Prof. Ana</div></div>
  `
};

function renderPage(name) {
  document.getElementById('content').innerHTML = PAGES[name] ? PAGES[name]() : '<div class="empty-state">Página não encontrada.</div>';
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.page === name));
  document.getElementById('page-filter').value = name;
}

document.getElementById('sidebar-nav').addEventListener('click', (e) => {
  const item = e.target.closest('.sidebar-item[data-page]');
  if (!item) return;
  e.preventDefault();
  renderPage(item.dataset.page);
});

document.getElementById('page-filter').addEventListener('change', (e) => {
  renderPage(e.target.value);
});

renderPage('home');
</script>
</body>
</html>
