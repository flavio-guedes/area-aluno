<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Área do Aluno — EPQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #020b16;
    --surface: #0a1628;
    --surface-2: #0f2140;
    --border: #1a3a5c;
    --text: #e6f3ff;
    --text-muted: #7d9cbd;
    --cyan: #4169E1;
    --cyan-dim: rgba(65,105,225,0.25);
    --green: #34d399;
    --green-dim: rgba(52,211,153,0.15);
    --orange: #fbbf24;
    --orange-dim: rgba(251,191,36,0.15);
    --red: #f87171;
    --red-dim: rgba(248,113,113,0.18);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }
  :focus-visible {
    outline: 2px solid var(--cyan);
    outline-offset: 2px;
    border-radius: 4px;
  }
  .grid-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(65,105,225,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(65,105,225,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 0;
  }
  .app {
    position: relative;
    z-index: 1;
    height: 100vh;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }
  .layout {
    display: flex;
    flex: 1;
    min-height: 0;
    gap: 12px;
  }
  .sidebar {
    width: 220px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .sidebar.collapsed { width: 60px; }
  .sidebar-brand {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-brand::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .sidebar-nav {
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .sidebar-item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    transition: all 0.15s;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .sidebar-item:hover, .sidebar-item.active {
    border-color: var(--cyan);
    color: var(--cyan);
    background: var(--cyan-dim);
  }
  .sidebar-footer {
    border-top: 1px solid var(--border);
    padding-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    overflow: hidden;
  }
  .toolbar {
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .search-input, .filter-select {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .search-input { flex: 1; min-width: 200px; }
  .search-input:focus, .filter-select:focus { border-color: var(--cyan); }
  .content-area {
    overflow-y: auto;
    flex: 1;
    min-height: 0;
    padding-right: 4px;
  }
  .content-area::-webkit-scrollbar { width: 6px; }
  .content-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: "";
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 8px var(--cyan);
  }
  .btn {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 6px 10px;
    border-radius: 6px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .btn.primary {
    background: var(--cyan-dim);
    border-color: var(--cyan);
    color: var(--cyan);
  }
  .item {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 8px;
  }
  .item:hover {
    border-color: var(--cyan);
    box-shadow: 0 0 12px var(--cyan-dim);
  }
  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .item-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .item-name::before {
    content: "";
    width: 3px; height: 3px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 4px var(--cyan);
  }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 6px;
  }
  .chip {
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    border: 1px solid var(--border);
    background: rgba(65,105,225,0.08);
    color: var(--text);
    white-space: nowrap;
  }
  .chip.ok { background: var(--green-dim); color: var(--green); border-color: rgba(52,211,153,0.3); }
  .chip.warn { background: var(--orange-dim); color: var(--orange); border-color: rgba(251,191,36,0.3); }
  .chip.danger { background: var(--red-dim); color: var(--red); border-color: rgba(248,113,113,0.3); }
  .item-body {
    display: none;
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }
  .item.expanded .item-body { display: block; }
  .item.expanded .item-expand { transform: rotate(45deg); }
  .item-expand {
    color: var(--cyan);
    font-size: 12px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .detail-section { margin-bottom: 8px; }
  .detail-section:last-child { margin-bottom: 0; }
  .detail-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .detail-text {
    font-size: 12px;
    color: var(--text);
    line-height: 1.5;
  }
  .actions {
    display: flex;
    gap: 8px;
    margin-top: 8px;
    flex-wrap: wrap;
  }
  .empty-state {
    padding: 24px 12px;
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  @media (max-width: 980px) {
    .sidebar { width: 60px; }
  }
  @media (max-width: 640px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; }
  }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="app">
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">EPQ</div>
      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="sidebar-item active" data-page="home" href="#">Início</a>
        <a class="sidebar-item" data-page="estudar" href="#">Estudar</a>
        <a class="sidebar-item" data-page="questoes" href="#">Questões</a>
        <a class="sidebar-item" data-page="simulados" href="#">Simulados</a>
        <a class="sidebar-item" data-page="desempenho" href="#">Desempenho</a>
        <a class="sidebar-item" data-page="cronograma" href="#">Cronograma</a>
        <a class="sidebar-item" data-page="materiais" href="#">Materiais</a>
      </nav>
      <div class="sidebar-footer">
        <a class="sidebar-item" href="#">Meu perfil</a>
        <a class="sidebar-item" href="#">Configurações</a>
      </div>
    </aside>

    <main class="main">
      <div class="toolbar">
        <input class="search-input" id="search" placeholder="Pesquisar questões, simulados ou materiais..." />
        <select class="filter-select" id="page-filter">
          <option value="home">Início</option>
          <option value="estudar">Estudar</option>
          <option value="questoes">Questões</option>
          <option value="simulados">Simulados</option>
          <option value="desempenho">Desempenho</option>
          <option value="cronograma">Cronograma</option>
          <option value="materiais">Materiais</option>
        </select>
      </div>
      <div class="content-area" id="content"></div>
    </main>
  </div>
</div>

<script>
const MOCK = {
  continue: {
    subject: "Direito Administrativo",
    lesson: "Aula 12 — Licitações",
    progress: 72
  },
  progress: {
    questions: 1248,
    accuracy: 78,
    streak: 12,
    hours: 34
  },
  today: [
    { subject: "Direito Administrativo", activity: "50 questões", status: "pendente" },
    { subject: "Português", activity: "30 questões", status: "pendente" },
    { subject: "Revisão", activity: "15 questões", status: "concluído" }
  ],
  questions: [
    {
      id: 1,
      subject: "Direito Administrativo",
      topic: "Licitações",
      statement: "Marque a alternativa correta sobre princípio da isonomia nas licitações.",
      options: ["A", "B", "C", "D"],
      answer: 0,
      explanation: "O princípio da isonomia visa tratar os licitantes de forma igualitária."
    }
  ],
  mockExams: [
    {
      name: "Simulado Polícia Penal — 01",
      questions: 50,
      time: 60,
      status: "pendente"
    }
  ]
};

const PAGES = {
  home: () => `
    <div class="section-title">Olá, João</div>
    <div style="color:var(--text-muted);font-size:12px;margin-bottom:12px;">Continue firme. Cada questão aproxima você da aprovação.</div>

    <div class="section-title">Continue de onde parou</div>
    <div class="item">
      <div class="item-header"><span class="item-name">${MOCK.continue.subject}</span></div>
      <div class="detail-section"><div class="detail-label">Aula atual</div><div class="detail-text">${MOCK.continue.lesson}</div></div>
      <div class="detail-section"><div class="detail-label">Progresso</div><div class="detail-text">${MOCK.continue.progress}%</div></div>
      <div class="actions"><button class="btn primary" onclick="alert('Continuar estudo')">Continuar estudando</button></div>
    </div>

    <div class="section-title" style="margin-top:12px;">Seu progresso</div>
    <div class="chips">
      <span class="chip">Questões resolvidas: ${MOCK.progress.questions}</span>
      <span class="chip ok">Acertos: ${MOCK.progress.accuracy}%</span>
      <span class="chip">Sequência: ${MOCK.progress.streak} dias</span>
      <span class="chip">Horas: ${MOCK.progress.hours}h</span>
    </div>

    <div class="section-title" style="margin-top:12px;">Para hoje</div>
    ${MOCK.today.map(task => `
      <div class="item">
        <div class="item-header"><span class="item-name">${task.subject}</span></div>
        <div class="detail-text">${task.activity}</div>
        <div class="actions"><button class="btn primary" onclick="alert('Iniciar atividade')">Iniciar</button></div>
      </div>
    `).join('')}
  `,
  questoes: () => `
    <div class="section-title">Questões</div>
    <div class="chips">
      <span class="chip">Disciplina</span>
      <span class="chip">Assunto</span>
      <span class="chip">Banca</span>
      <span class="chip">Cargo</span>
      <span class="chip">Dificuldade</span>
      <span class="chip">Ano</span>
    </div>
    ${MOCK.questions.map(q => `
      <div class="item">
        <div class="item-header"><span class="item-name">Questão ${q.id}</span></div>
        <div class="detail-section"><div class="detail-label">Enunciado</div><div class="detail-text">${q.statement}</div></div>
        <div class="actions"><button class="btn primary" onclick="alert('Responder questão')">Responder</button></div>
      </div>
    `).join('')}
  `,
  simulados: () => `
    <div class="section-title">Simulados</div>
    ${MOCK.mockExams.map(s => `
      <div class="item">
        <div class="item-header"><span class="item-name">${s.name}</span></div>
        <div class="detail-text">${s.questions} questões • ${s.time} minutos</div>
        <div class="actions"><button class="btn primary" onclick="alert('Iniciar simulado')">Iniciar simulado</button></div>
      </div>
    `).join('')}
  `,
  desempenho: () => `
    <div class="section-title">Desempenho</div>
    <div class="chips">
      <span class="chip ok">Acertos: ${MOCK.progress.accuracy}%</span>
      <span class="chip warn">Português: 54%</span>
      <span class="chip">Direito Constitucional: 61%</span>
    </div>
    <div class="section-title" style="margin-top:12px;">Precisa de atenção</div>
    <div class="item"><div class="item-header"><span class="item-name">Português</span></div><div class="detail-text">Concordância verbal — 54%</div><div class="actions"><button class="btn primary" onclick="alert('Praticar')">Praticar</button></div></div>
    <div class="item"><div class="item-header"><span class="item-name">Direito Constitucional</span></div><div class="detail-text">Controle de constitucionalidade — 61%</div><div class="actions"><button class="btn primary" onclick="alert('Praticar')">Praticar</button></div></div>
  `,
  cronograma: () => `
    <div class="section-title">Cronograma</div>
    <div class="item"><div class="item-header"><span class="item-name">Hoje</span></div><div class="detail-text">Direito Administrativo — 50 questões</div></div>
    <div class="item"><div class="item-header"><span class="item-name">Amanhã</span></div><div class="detail-text">Português — 30 questões</div></div>
  `,
  materiais: () => `
    <div class="section-title">Materiais</div>
    <div class="item"><div class="item-header"><span class="item-name">PDF</span></div><div class="detail-text">Direito Administrativo — Aula 12</div></div>
    <div class="item"><div class="item-header"><span class="item-name">Videoaula</span></div><div class="detail-text">Licitações — Prof. Ana</div></div>
  `
};

function renderPage(name) {
  document.getElementById('content').innerHTML = PAGES[name] ? PAGES[name]() : '<div class="empty-state">Página não encontrada.</div>';
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.toggle('active', el.dataset.page === name));
  document.getElementById('page-filter').value = name;
}

document.getElementById('sidebar-nav').addEventListener('click', (e) => {
  const item = e.target.closest('.sidebar-item[data-page]');
  if (!item) return;
  e.preventDefault();
  renderPage(item.dataset.page);
});

document.getElementById('page-filter').addEventListener('change', (e) => {
  renderPage(e.target.value);
});

renderPage('home');
</script>
</body>
</html>
